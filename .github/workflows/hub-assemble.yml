name: Assemble & Deploy Unified Platform Hub

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [spoke-updated]

jobs:
  assemble-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Harden HTML/TypeScript Client Bundle (BLA)
        run: |
          echo "Running Blind LLM Agents (BLA) build-time obfuscation on Hub UI..."
          # npm ci && npm run build && npx bla-harden ./dist

      - name: Pull Latest Spoke Containers & Deploy Unified Stack
        env:
          TRIGGERED_BY: ${{ github.event.client_payload.service || 'hub-direct' }}
        run: |
          echo "Assembling platform triggered by: $TRIGGERED_BY"
          # Pulls latest Java, C/C++, Python, and Node containers defined in docker-compose.prod.yml
          # docker compose -f docker-compose.prod.yml pull
          # docker compose -f docker-compose.prod.yml up -d --remove-orphans

      - name: Post-Deploy Live Security Verification (Nuclei, Strix, PyRIT)
        env:
          TARGET_URL: ${{ vars.STAGING_HUB_URL }}
          STRIX_API_KEY: ${{ secrets.STRIX_API_KEY }}
        run: |
          echo "Running Nuclei, Strix, and PyRIT against $TARGET_URL..."
