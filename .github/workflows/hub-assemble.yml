name: Assemble & Deploy Unified Platform Hub

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [spoke-updated]

jobs:
  assemble-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assembly Status
        env:
          TRIGGERED_BY: ${{ github.event.client_payload.service || 'hub-direct' }}
          SPOKE_LANG: ${{ github.event.client_payload.language || 'hub' }}
        run: |
          echo "Central Hub triggered by: $TRIGGERED_BY ($SPOKE_LANG)"
          docker compose -f docker-compose.prod.yml config -q
          echo "docker-compose.prod.yml validated successfully."