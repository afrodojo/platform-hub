name: Assemble, Build & Verify Unified Platform Hub

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [spoke-updated]

permissions:
  contents: read
  packages: write

jobs:
  build-hub-portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Hub Portal Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Validate Unified Compose Stack
        env:
          TRIGGERED_BY: ${{ github.event.client_payload.service || 'hub-direct' }}
          SPOKE_LANG: ${{ github.event.client_payload.language || 'node' }}
        run: |
          echo "Central Hub assembled (triggered by: $TRIGGERED_BY / $SPOKE_LANG)"
          docker compose -f docker-compose.prod.yml config -q