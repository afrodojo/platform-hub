name: Reusable Polyglot Security Gate

on:
  workflow_call:
    inputs:
      language:
        required: true
        type: string # 'java', 'cpp', 'python', 'node'

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

      - name: Semgrep SAST Scan
        uses: semgrep/semgrep-action@v1
        with:
          config: auto

      - name: C/C++ Static & Memory Analysis
        if: inputs.language == 'cpp'
        run: |
          sudo apt-get update && sudo apt-get install -y cppcheck
          cppcheck --enable=warning,performance,portability --error-exitcode=1 .

      - name: Java Security & Dependency Check
        if: inputs.language == 'java'
        run: |
          echo "Running SpotBugs / OWASP check on Java build..."
          # mvn spotbugs:check || ./gradlew spotbugsMain

      - name: Trivy Vulnerability & Container Scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
